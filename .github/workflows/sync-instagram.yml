name: Sync Instagram to BOOKMARK
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_LIMIT: '50'
        run: npm run sync
      - name: Commit updated site data
        run: |
          git config user.name "BOOKMARK Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "sync: Instagram posts"
          git push
