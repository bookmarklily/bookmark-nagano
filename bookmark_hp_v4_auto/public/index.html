<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c928"><title>BOOKMARK｜長野県ダンスイベント情報</title>
<style>
:root{--y:#f7c928;--ink:#101010;--bg:#f4f1e9;--line:#d9d4c8;--muted:#756f65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1100px;margin:auto;padding:0 18px}header{position:sticky;top:0;z-index:9;background:#f4f1e9ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}nav{height:62px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:1000}.ig{background:#111;color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900}.hero{background:var(--y);border-bottom:1px solid #111}.hero .wrap{padding-top:44px;padding-bottom:38px}.hero small{font-weight:900;letter-spacing:.15em}.hero h1{font-size:clamp(40px,8vw,72px);line-height:.98;letter-spacing:-.055em;margin:12px 0}.hero p{max-width:680px;line-height:1.7;font-weight:650}.sync{font-size:10px;margin-top:12px;opacity:.7}.search{display:flex;gap:8px;max-width:680px;margin-top:22px}.search input{flex:1;border:2px solid #111;border-radius:10px;padding:14px;background:#fff;font:inherit}.search button{border:0;background:#111;color:#fff;border-radius:10px;padding:0 20px;font-weight:900}.filters{padding:25px 0 6px}.filters h2,.events h2{font-size:23px;margin:0 0 12px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.chip{border:1px solid #aaa49a;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:11px;font-weight:900;cursor:pointer}.chip.on{background:#111;color:#fff;border-color:#111}.events{padding:18px 0 60px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.visual{position:relative;aspect-ratio:4/5;background:#ddd;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;background:var(--y);border:1px solid #111;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:1000}.review{position:absolute;right:10px;top:10px;background:#fff;border:1px solid #111;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900}.body{padding:14px}.place{font-size:10px;color:var(--muted);font-weight:900}.body h3{font-size:17px;line-height:1.35;margin:5px 0 8px}.meta{font-size:11px;line-height:1.65}.buttons{display:flex;gap:7px;margin-top:12px}.btn{flex:1;text-align:center;border:1px solid #111;border-radius:9px;padding:10px 7px;font-size:10px;font-weight:900}.btn.primary{background:#111;color:#fff}.empty{padding:40px 0;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 0 45px;font-size:10px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.visual{aspect-ratio:1/1.08}.search{flex-direction:column}.search button{padding:13px}}
</style></head><body><header><div class="wrap"><nav><b class="logo">BOOKMARK.</b><a class="ig" href="https://www.instagram.com/bookmark_nagano/" target="_blank" rel="noopener">Instagram ↗</a></nav></div></header>
<section class="hero"><div class="wrap"><small>NAGANO DANCE EVENT INFORMATION</small><h1>長野のダンスを、<br>見つける。</h1><p>BOOKMARKのInstagram投稿からイベント情報を同期。地域・種別で探し、元投稿へ直接移動できます。</p><div class="search"><input id="q" placeholder="イベント名・市町村・会場で検索"><button id="searchBtn">検索</button></div><div class="sync" id="sync">Instagram同期情報を確認中…</div></div></section>
<main class="wrap"><section class="filters"><h2>絞り込む</h2><div class="chips" id="chips"><button class="chip on" data-f="all">すべて</button><button class="chip" data-f="北信">北信</button><button class="chip" data-f="東信">東信</button><button class="chip" data-f="中信">中信</button><button class="chip" data-f="南信">南信</button><button class="chip" data-f="SHOWCASE">SHOWCASE</button><button class="chip" data-f="BATTLE">BATTLE</button><button class="chip" data-f="WORKSHOP">WORKSHOP</button><button class="chip" data-f="CONTEST">CONTEST</button><button class="chip" data-f="EVENT">EVENT</button></div></section><section class="events"><h2>イベント</h2><div id="grid" class="grid"></div></section></main><footer><div class="wrap">BOOKMARK｜Nagano Dance Event Information</div></footer>
<script>
let events=[],filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){try{events=await(await fetch('data/events.json',{cache:'no-store'})).json()}catch(e){events=[]}try{const s=await(await fetch('data/sync.json',{cache:'no-store'})).json();const d=new Date(s.syncedAt);document.getElementById('sync').textContent=`Instagram自動同期｜${d.toLocaleString('ja-JP')}｜${s.count}件`;}catch(e){document.getElementById('sync').textContent='Instagram同期準備中'}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()});document.getElementById('q').oninput=render;document.getElementById('searchBtn').onclick=render;render()}
function render(){const q=document.getElementById('q').value.toLowerCase();const rows=events.filter(e=>{const h=[e.title,e.area,e.city,e.type,e.venue,e.caption].join(' ').toLowerCase();return(filter==='all'||h.includes(filter.toLowerCase()))&&(!q||h.includes(q))});document.getElementById('grid').innerHTML=rows.length?rows.map(e=>`<article class="card"><div class="visual">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.title)}" loading="lazy">`:''}<span class="badge">${esc(e.type)}</span>${e.needsReview?'<span class="review">要確認</span>':''}</div><div class="body"><div class="place">${esc(e.city)}｜${esc(e.area)}</div><h3>${esc(e.title)}</h3><div class="meta"><b>${esc(e.dateLabel)}</b><br>${esc(e.time)}<br>${esc(e.venue)}</div><div class="buttons"><a class="btn primary" href="${esc(e.instagram)}" target="_blank" rel="noopener">Instagram投稿 ↗</a></div></div></article>`).join(''):'<div class="empty">該当するイベントはありません。</div>'}
init();
</script></body></html>
